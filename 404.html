<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#00ff88',
                        secondary: '#0a84ff',
                        accent: '#ff6b6b',
                    },
                    fontFamily: {
                        'mono': ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        .code-block {
            background: #0d1117;
            border: 1px solid #21262d;
        }
        .syntax-comment { color: #8b949e; }
        .syntax-string { color: #a5d6ff; }
        .syntax-keyword { color: #ff7b72; }
        .syntax-number { color: #79c0ff; }
    </style>
</head>
<body class="bg-black text-gray-100 font-mono min-h-screen flex items-center justify-center">
    <div class="max-w-2xl w-full px-6">
        <div class="code-block rounded-lg p-8">
            <div class="flex items-center mb-6">
                <div class="flex space-x-2">
                    <div class="w-3 h-3 bg-red-500 rounded-full"></div>
                    <div class="w-3 h-3 bg-yellow-500 rounded-full"></div>
                    <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                </div>
                <span class="ml-4 text-gray-400 text-sm">error404.js</span>
            </div>
            
            <div class="font-mono text-sm leading-loose">
                <div class="mb-4">
                    <span class="syntax-comment">// Oops! Parece que te perdiste...</span>
                </div>
                <div class="mb-4">
                    <span class="syntax-keyword">const</span> 
                    <span class="text-gray-300"> error = {</span>
                </div>
                <div class="ml-4 mb-2">
                    <span class="text-gray-300">code:</span> 
                    <span class="syntax-number">404</span><span class="text-gray-300">,</span>
                </div>
                <div class="ml-4 mb-2">
                    <span class="text-gray-300">message:</span> 
                    <span class="syntax-string">"Página no encontrada"</span><span class="text-gray-300">,</span>
                </div>
                <div class="ml-4 mb-2">
                    <span class="text-gray-300">suggestion:</span> 
                    <span class="syntax-string">"¿Quizás buscabas el home?"</span>
                </div>
                <div class="mb-6">
                    <span class="text-gray-300">};</span>
                </div>
                
                <div class="text-center">
                    <h1 class="text-6xl font-bold text-accent mb-4">404</h1>
                    <p class="text-xl text-gray-300 mb-8">
                        La página que buscas no existe en este servidor.
                    </p>
                    
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <a href="/" 
                           class="px-6 py-3 bg-primary text-black rounded font-mono text-sm hover:bg-primary/80 transition-colors">
                            🏠 Volver al inicio
                        </a>
                        <a href="javascript:history.back()" 
                           class="px-6 py-3 bg-gray-800 border border-gray-700 rounded font-mono text-sm hover:border-primary transition-colors">
                            ← Ir atrás
                        </a>
                    </div>
                </div>
                
                <div class="mt-8 pt-6 border-t border-gray-700">
                    <span class="syntax-comment">// Si crees que esto es un error, contacta al admin</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
